<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family:'Poppins',sans-serif;
background: linear-gradient(135deg,#ff9a9e,#fecfef);
overflow:hidden;
}

/* corazones flotando */

.heart{
position:absolute;
color:red;
font-size:20px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

h1{
font-family:'Dancing Script',cursive;
font-size:50px;
color:white;
text-shadow:0 0 10px rgba(0,0,0,0.3);
}

.botones{
margin-top:30px;
}

button{
font-size:20px;
padding:15px 40px;
border:none;
border-radius:30px;
cursor:pointer;
transition:0.3s;
margin:10px;
}

#si{
background:#ff4d6d;
color:white;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
}

#si:hover{
transform:scale(1.1);
}

#no{
background:white;
position:absolute;
}

#mensaje{
font-size:40px;
font-family:'Dancing Script',cursive;
color:white;
margin-top:20px;
display:none;
}

</style>
</head>

<body>

<h1>¿Quieres ser mi novia? ❤️</h1>

<div class="botones">
<button id="si">Sí 💖</button>
<button id="no">No</button>
</div>

<div id="mensaje">Sabía que dirías que sí 😍</div>

<audio id="musica" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>

let noBtn = document.getElementById("no")
let siBtn = document.getElementById("si")
let mensaje = document.getElementById("mensaje")
let musica = document.getElementById("musica")

document.body.addEventListener("click",()=>{
musica.play()
})

noBtn.addEventListener("mouseover",moverBoton)
noBtn.addEventListener("click",moverBoton)

function moverBoton(){
let x = Math.random()*window.innerWidth
let y = Math.random()*window.innerHeight

noBtn.style.left = x+"px"
noBtn.style.top = y+"px"
}

siBtn.addEventListener("click",()=>{
mensaje.style.display="block"
crearCorazones()
})

function crearCorazones(){

setInterval(()=>{

let heart = document.createElement("div")
heart.classList.add("heart")
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(Math.random()*20+20)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},5000)

},200)

}

</script>

</body>
</html>
