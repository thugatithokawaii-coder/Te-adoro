<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pregunta importante</title>

<style>
body{
    text-align:center;
    font-family: Arial;
    margin-top:100px;
    background-color:#ffe6f0;
}

button{
    font-size:20px;
    padding:10px 20px;
    margin:10px;
    cursor:pointer;
}

#no{
    position:absolute;
}
</style>
</head>

<body>

<h1>¿Quieres ser mi novia? ❤️</h1>

<button onclick="aceptar()">Sí</button>
<button id="no" onmouseover="mover()">No</button>

<script>

function aceptar(){
    alert("Sabía que dirías que sí ❤️");
}

function mover(){
    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;

    document.getElementById("no").style.left = x + "px";
    document.getElementById("no").style.top = y + "px";
}

</script>

</body>
</html>
